<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,800;1,500&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1350px; overflow:hidden; }
  body {
    font-family: Inter, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(155deg, var(--bg1) 0%, var(--bg2) 55%, var(--bg3) 100%);
    color: var(--fg);
    padding: 54px 54px 44px;
    display:flex; flex-direction:column; position:relative;
    --s: 1;                       /* step-block scale, tuned by fit() */
  }
  /* Colour washes. position:fixed keeps them out of the overflow measurement. */
  body::before, body::after { content:""; position:fixed; border-radius:50%; z-index:0;
                              pointer-events:none; }
  body::before { width:780px; height:780px; right:-270px; top:-310px;
                 background:radial-gradient(circle closest-side, var(--wash1), transparent);
                 opacity:.75; }
  body::after  { width:660px; height:660px; left:-250px; bottom:-270px;
                 background:radial-gradient(circle closest-side, var(--wash2), transparent);
                 opacity:.7; }
  body > * { position:relative; z-index:1; }

  body[data-theme="0"] {   /* sky */
    --bg1:#EAF6FF; --bg2:#F7FBFF; --bg3:#FFF6EC; --fg:#0B2239; --muted:#4C6379;
    --accent:#0284C7; --accent2:#F97316; --card:#FFFFFF; --tint:#D7EDFB;
    --wash1:#BFE4FA; --wash2:#FFD9B8; }
  body[data-theme="1"] {   /* coral */
    --bg1:#FFF0EA; --bg2:#FFF8F4; --bg3:#FFFCEB; --fg:#3A1408; --muted:#7C5346;
    --accent:#EA4E1B; --accent2:#F5B700; --card:#FFFFFF; --tint:#FFDCCB;
    --wash1:#FFC9AE; --wash2:#FFEBAF; }
  body[data-theme="2"] {   /* mint */
    --bg1:#E6FBF1; --bg2:#F5FEF9; --bg3:#EFFAFF; --fg:#06291F; --muted:#3F6B5C;
    --accent:#059669; --accent2:#06B6D4; --card:#FFFFFF; --tint:#C4F1DE;
    --wash1:#A9EFD3; --wash2:#B6EAF6; }
  body[data-theme="3"] {   /* lemon */
    --bg1:#FFF9E0; --bg2:#FFFDF2; --bg3:#FFF1F3; --fg:#332204; --muted:#7A6031;
    --accent:#D97706; --accent2:#E11D48; --card:#FFFFFF; --tint:#FFECB8;
    --wash1:#FFE08A; --wash2:#FFCBD5; }
  body[data-theme="4"] {   /* lavender */
    --bg1:#F0EBFF; --bg2:#FAF8FF; --bg3:#EAF7FF; --fg:#1E1440; --muted:#5B4E86;
    --accent:#7C3AED; --accent2:#0EA5E9; --card:#FFFFFF; --tint:#E1D6FE;
    --wash1:#CFBDFB; --wash2:#B9E5FA; }
  body[data-theme="5"] {   /* rose */
    --bg1:#FFECF3; --bg2:#FFF7FA; --bg3:#F3F0FF; --fg:#3A0C22; --muted:#84495F;
    --accent:#DB2777; --accent2:#8B5CF6; --card:#FFFFFF; --tint:#FCD3E3;
    --wash1:#FBB6D0; --wash2:#D6C7FB; }

  svg { display:block; fill:none; stroke:currentColor; stroke-width:1.8;
        stroke-linecap:round; stroke-linejoin:round; }

  /* ---------- head ---------- */
  .kicker { display:inline-block; font-size:21px; font-weight:700; letter-spacing:.2em;
            text-transform:uppercase; color:var(--accent); background:var(--tint);
            padding:9px 18px; border-radius:99px; margin-bottom:16px; align-self:flex-start; }
  h1 { font-size:66px; line-height:1.03; font-weight:800; letter-spacing:-.024em; }
  .hook { margin-top:14px; font-size:26px; line-height:1.32; color:var(--muted); max-width:900px; }

  /* ---------- hero: illustration flanked by stat callouts ---------- */
  .hero { position:relative; height:398px; margin:20px 0 22px; flex:none; }
  .art { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
         width:430px; height:398px; object-fit:contain; }

  .stat { position:absolute; width:258px; }
  .stat .v { font-size:56px; font-weight:800; line-height:1; letter-spacing:-.03em;
             color:var(--accent); }
  .stat .l { margin-top:9px; font-size:19px; line-height:1.3; color:var(--muted); }
  .stat .lead { margin-top:12px; height:2px; width:78px; background:var(--accent);
                position:relative; }
  .stat .lead::after { content:""; position:absolute; top:-3.5px; width:9px; height:9px;
                       border-radius:50%; background:var(--accent); }

  .stat.a { left:0;  top:4px;    text-align:right; }
  .stat.c { left:0;  bottom:10px; text-align:right; }
  .stat.a .lead, .stat.c .lead { margin-left:auto; }
  .stat.a .lead::after, .stat.c .lead::after { right:-4px; }

  .stat.b { right:0; top:132px;  text-align:left; }
  .stat.b .v, .stat.b .l { color:var(--accent2); }
  .stat.b .l { color:var(--muted); }
  .stat.b .lead { background:var(--accent2); }
  .stat.b .lead::after { left:-4px; background:var(--accent2); }

  /* No illustration came back: stats become a plain row instead of orbiting nothing. */
  .hero.no-art { height:auto; display:flex; gap:22px; justify-content:space-between; }
  .hero.no-art .stat { position:static; text-align:left; width:auto; flex:1;
                       background:var(--card); border-radius:20px; padding:20px 22px;
                       box-shadow:0 12px 28px -18px rgba(16,24,40,.45); }
  .hero.no-art .stat .lead { display:none; }
  .hero.no-art .art { display:none; }

  /* ---------- steps ---------- */
  .steps { flex:1; display:flex; flex-direction:column; justify-content:center;
           gap: calc(var(--s) * 13px); }
  .step { display:flex; gap: calc(var(--s) * 20px); align-items:center; }

  .tile { position:relative; flex:none;
          width: calc(var(--s) * 78px); height: calc(var(--s) * 78px);
          border-radius: calc(var(--s) * 21px);
          background:var(--tint); color:var(--accent);
          display:flex; align-items:center; justify-content:center; }
  .tile svg { width: calc(var(--s) * 42px); height: calc(var(--s) * 42px); }
  .step:nth-child(even) .tile { color:var(--accent2); }
  .step:nth-child(even) .tile .n { background:var(--accent2); }
  .tile .n { position:absolute; top: calc(var(--s) * -7px); left: calc(var(--s) * -7px);
             width: calc(var(--s) * 30px); height: calc(var(--s) * 30px); border-radius:50%;
             background:var(--accent); color:#fff; box-shadow:0 0 0 4px var(--bg2);
             font-size: calc(var(--s) * 17px); font-weight:800;
             display:flex; align-items:center; justify-content:center; }

  .label { font-size: calc(var(--s) * 29px); font-weight:700; line-height:1.15; }
  .text  { font-size: calc(var(--s) * 22px); line-height:1.38; color:var(--muted);
           margin-top: calc(var(--s) * 5px); }

  .steps[data-layout="cards"] { gap: calc(var(--s) * 10px); }
  .steps[data-layout="cards"] .step { background:var(--card); border-radius:22px;
                                      padding: calc(var(--s) * 11px) calc(var(--s) * 18px);
                                      box-shadow:0 12px 28px -18px rgba(16,24,40,.4); }
  .steps[data-layout="flow"] .step { position:relative; }
  .steps[data-layout="flow"] .step:not(:last-child)::before {
    content:""; position:absolute; left: calc(var(--s) * 39px);
    top: calc(100% - var(--s) * 4px); height: calc(var(--s) * 22px);
    width:3px; background:var(--accent); opacity:.3; }

  /* ---------- quote ---------- */
  .quote { display:none; margin-top:16px; padding:16px 22px; border-left:6px solid var(--accent2);
           background:var(--card); border-radius:0 18px 18px 0;
           box-shadow:0 12px 28px -20px rgba(16,24,40,.45); }
  .quote.on { display:block; }
  .quote q { font-size:25px; line-height:1.34; font-style:italic; font-weight:500; quotes:none; }
  .quote cite { display:block; margin-top:8px; font-size:19px; font-style:normal;
                color:var(--muted); }

  footer { display:flex; justify-content:space-between; align-items:center;
           font-size:21px; color:var(--muted); padding-top:18px; margin-top:14px;
           border-top:2px solid color-mix(in srgb, var(--accent) 28%, transparent); }
  footer .field { color:var(--accent); font-weight:600; text-transform:uppercase; letter-spacing:.14em; }
</style>
</head>
<body>
  <div class="kicker" id="kicker">How it works</div>
  <h1 id="title"></h1>
  <div class="hook" id="hook"></div>

  <div class="hero" id="hero"><img class="art" id="art" alt=""></div>

  <div class="steps" id="steps"></div>

  <div class="quote" id="quote"><q id="qtext"></q><cite id="qwho"></cite></div>

  <footer>
    <span class="field" id="field"></span>
    <span id="handle"></span>
  </footer>

<script>
  const DATA   = {{DATA}};
  const ICONS  = {{ICONS}};
  const THEME  = {{THEME}};
  const LAYOUT = {{LAYOUT}};
  const HANDLE = {{HANDLE}};
  const ART    = {{ART}};          // data: URI, or "" when generation failed
  const FALLBACK = "gear";

  const glyph = name => '<svg viewBox="0 0 24 24">' + (ICONS[name] || ICONS[FALLBACK]) + '</svg>';

  document.body.dataset.theme = String(THEME);
  document.getElementById("title").textContent  = DATA.title;
  document.getElementById("hook").textContent   = DATA.hook;
  document.getElementById("field").textContent  = DATA.field || "process";
  document.getElementById("handle").textContent = HANDLE;

  const hero = document.getElementById("hero");
  const art  = document.getElementById("art");
  if (ART) { art.src = ART; } else { hero.classList.add("no-art"); }

  const SLOTS = ["a", "b", "c"];
  (DATA.stats || []).slice(0, 3).forEach((st, i) => {
    const el = document.createElement("div");
    el.className = "stat " + SLOTS[i];
    el.innerHTML = '<div class="v"></div><div class="l"></div><div class="lead"></div>';
    el.querySelector(".v").textContent = st.value;
    el.querySelector(".l").textContent = st.label;
    hero.appendChild(el);
  });

  const steps = document.getElementById("steps");
  steps.dataset.layout = LAYOUT;
  for (const s of DATA.steps) {
    const el = document.createElement("div");
    el.className = "step";
    el.innerHTML =
      '<div class="tile"><div class="n">' + s.n + '</div>' + glyph(s.icon) + '</div>' +
      '<div><div class="label"></div><div class="text"></div></div>';
    el.querySelector(".label").textContent = s.label;
    el.querySelector(".text").textContent  = s.text;
    steps.appendChild(el);
  }

  if (DATA.quote && DATA.quote.text) {
    document.getElementById("qtext").textContent = "“" + DATA.quote.text + "”";
    document.getElementById("qwho").textContent  = "— " + DATA.quote.who;
    document.getElementById("quote").classList.add("on");
  }

  // Fill the 1350px frame exactly: shrink whatever overflows, then grow into what is left.
  (function fit() {
    const h1 = document.getElementById("title");
    const over = () => document.body.scrollHeight > 1350
                    || steps.scrollHeight > steps.clientHeight + 1;
    const setScale = v => document.body.style.setProperty("--s", v.toFixed(2));

    for (let size = 66; over() && size > 38; size -= 2) h1.style.fontSize = size + "px";
    for (let s = 1.0; over() && s > 0.62; s -= 0.02) setScale(s);

    if (!over()) {
      let s = 1.0;
      while (s < 1.55) {
        const next = s + 0.02;
        setScale(next);
        if (over()) { setScale(s); break; }
        s = next;
      }
    }
  })();
</script>
</body>
</html>
