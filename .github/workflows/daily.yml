name: daily-post

on:
  push:
    branches: [main]
    paths: ["data/queue/*.json"]   # the Claude routine drops today's payload here
  workflow_dispatch:
    inputs:
      payload:
        description: "Path to a payload JSON (empty = newest in data/queue)"
        default: ""
      dry_run:
        description: "Generate and render only, publish nothing"
        type: boolean
        default: true
      targets:
        description: "Comma list of networks (empty = repo variable TARGETS)"
        default: ""
      reel:
        description: "Also render and publish a reel via HeyGen"
        type: boolean
        default: false

permissions:
  contents: write             # needed to commit data/used_topics.json back

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m playwright install --with-deps chromium

      - name: Pick payload
        id: pick
        run: |
          P="${{ inputs.payload }}"
          if [ -z "$P" ]; then P=$(ls -1 data/queue/*.json 2>/dev/null | sort | tail -n1); fi
          if [ -z "$P" ]; then echo "no payload in data/queue"; exit 1; fi
          echo "path=$P" >> "$GITHUB_OUTPUT"
          echo "using $P"

      - name: Git identity for media commits
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run publisher
        env:
          STORAGE: ${{ vars.STORAGE }}
          GRAPH_API_VERSION: ${{ vars.GRAPH_API_VERSION }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY }}
          IMAGE_API_BASE: ${{ vars.IMAGE_API_BASE }}
          IMAGE_MODEL: ${{ vars.IMAGE_MODEL }}
          IMAGE_SIZE: ${{ vars.IMAGE_SIZE }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_REGION: ${{ vars.S3_REGION }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
          BRAND_HANDLE: ${{ vars.BRAND_HANDLE }}
          MONTHLY_BUDGET_USD: ${{ vars.MONTHLY_BUDGET_USD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python -m src.main \
            --from-payload "${{ steps.pick.outputs.path }}" \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            --targets "${{ inputs.targets || vars.TARGETS || 'facebook,instagram' }}"

      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-${{ github.run_id }}
          path: out/
          retention-days: 14

      - name: Commit used topics and cost ledger
        if: always() && !inputs.dry_run
        run: |
          git add data/used_topics.json data/costs.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "chore: record published topic and spend"
          git pull --rebase -q origin main
          git push

  reel:
    needs: post
    if: >-
      always() && needs.post.result == 'success' &&
      (inputs.reel || (github.event_name == 'push' && vars.REELS_ENABLED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 45          # HeyGen renders at roughly 5-10x the reel length
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pull today's topic from the post job
        uses: actions/download-artifact@v4
        with:
          name: post-${{ github.run_id }}
          path: out/

      - name: Render and publish reel
        env:
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
          HEYGEN_VOICE_ID: ${{ vars.HEYGEN_VOICE_ID }}
          HEYGEN_STYLE_ID: ${{ vars.HEYGEN_STYLE_ID }}
          HEYGEN_BRAND_KIT_ID: ${{ vars.HEYGEN_BRAND_KIT_ID }}
          REEL_LANGUAGE: ${{ vars.REEL_LANGUAGE }}
          REEL_SECONDS: ${{ vars.REEL_SECONDS }}
          REEL_FACELESS: ${{ vars.REEL_FACELESS }}
          REEL_TARGETS: ${{ vars.REEL_TARGETS }}
          GRAPH_API_VERSION: ${{ vars.GRAPH_API_VERSION }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY }}
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_CHAR_LIMIT: ${{ vars.X_CHAR_LIMIT }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_REGION: ${{ vars.S3_REGION }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
          MONTHLY_BUDGET_USD: ${{ vars.MONTHLY_BUDGET_USD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          git pull -q origin main || true
          python -m src.shorts.main \
            --from-payload out/payload.json \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit cost ledger
        if: always() && !inputs.dry_run
        run: |
          git add data/costs.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: record reel spend"
          git pull --rebase -q origin main
          git push

      - name: Upload reel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.run_id }}
          path: |
            out/reel-*.mp4
            out/reel.json
          retention-days: 14
