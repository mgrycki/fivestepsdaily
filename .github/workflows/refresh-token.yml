name: refresh-meta-token

on:
  schedule:
    - cron: "0 5 1 * *"       # 1st of each month, well inside the ~60 day window
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests python-dotenv
      - name: Exchange token
        env:
          GRAPH_API_VERSION: ${{ vars.GRAPH_API_VERSION }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.REPO_PAT }}     # PAT with `secrets:write` on this repo
        run: |
          NEW=$(python scripts/refresh_token.py)
          if [ -z "$NEW" ]; then echo "empty token"; exit 1; fi
          echo "::add-mask::$NEW"
          if [ -n "$GH_TOKEN" ]; then
            gh secret set PAGE_ACCESS_TOKEN --body "$NEW" --repo "${{ github.repository }}"
            echo "secret rotated"
          else
            echo "REPO_PAT not set -- rotate PAGE_ACCESS_TOKEN by hand"; exit 1
          fi
